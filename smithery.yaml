# Smithery configuration for Synter MCP Server
# Open-source MCP server for running ads with AI agents across 30+ ad platforms: free reads ($0.00/mo), $20/mo Solo ($20/mo usage value included; $0.05-$0.25 writes), 0% of ad spend.
# Enables 1-click install and discovery across Claude Code, Cursor, Windsurf, and Smithery.ai
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      synterApiKey:
        type: string
        description: "Synter API Key (starts with syn_). Auto-detected if synter CLI or SYNTER_API_KEY is configured."
  command:
    - "node"
    - "dist/index.js"
