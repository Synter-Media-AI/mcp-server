name: MCP Discovery Validate

on:
  pull_request:
    paths:
      - ".mcp.json"
      - "README.md"
      - "package.json"
      - "server.json"
      - "manifest.json"
      - "gemini-extension.json"
      - "AGENTS.md"
      - "GEMINI.md"
      - "llms.txt"
      - "skills/**"
      - ".claude-plugin/**"
      - "plugin.json"
      - "smithery.yaml"
      - "scripts/validate-discovery.mjs"
      - ".github/workflows/mcp-discovery-validate.yml"
  push:
    branches:
      - main
    paths:
      - ".mcp.json"
      - "README.md"
      - "package.json"
      - "server.json"
      - "manifest.json"
      - "gemini-extension.json"
      - "AGENTS.md"
      - "GEMINI.md"
      - "llms.txt"
      - "skills/**"
      - ".claude-plugin/**"
      - "plugin.json"
      - "smithery.yaml"
      - "scripts/validate-discovery.mjs"
      - ".github/workflows/mcp-discovery-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate discovery metadata
        run: node scripts/validate-discovery.mjs
