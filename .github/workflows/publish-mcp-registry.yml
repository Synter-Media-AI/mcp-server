name: Publish to npm and MCP Registry

# Publishes @synterai/mcp-server to npm via keyless GitHub OIDC Trusted Publishing
# (with SLSA build provenance) and registers the release with registry.modelcontextprotocol.io.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for npm OIDC Trusted Publishing + mcp-publisher github-oidc
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT set registry-url or NODE_AUTH_TOKEN; doing so disables npm's OIDC exchange.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies, build, and test
        run: |
          npm install --no-package-lock
          npm test
          npm run validate:discovery

      - name: Check tag matches server.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          SERVER_VERSION="$(node -p "require('./server.json').version")"
          if [ "$TAG_VERSION" != "$SERVER_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match server.json version $SERVER_VERSION."
            echo "Bump server.json, package.json and manifest.json together, then re-tag."
            exit 1
          fi
          echo "tag and server.json agree on $SERVER_VERSION"

      - name: Publish to npm via GitHub OIDC Trusted Publishing (if not yet published)
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION is already live on npm; skipping npm publish."
          else
            echo "Publishing $PKG@$VERSION to npm via keyless GitHub OIDC..."
            npm publish --access public --provenance
            for i in $(seq 1 18); do
              if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
                echo "$PKG@$VERSION verified live on npm."
                break
              fi
              sleep 5
            done
            npm view "$PKG@$VERSION" version >/dev/null 2>&1 || {
              echo "::error::$PKG@$VERSION not visible on npm after publish."
              exit 1
            }
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Confirm what the registry now serves
        run: |
          NAME="$(node -p "require('./server.json').name")"
          echo "Registered as: $NAME"
          curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=synter-ads"             | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);const seen={};for(const e of (j.servers||[])){const n=e.name||e.server?.name;const v=e.version||e.server?.version;(seen[n]=seen[n]||[]).push(v)}for(const [n,vs] of Object.entries(seen))console.log(" ",n,"->",[...new Set(vs)].sort().join(", "))})'
